name: Release Hackage packages
on:
  push:
    branches: [main]
    paths:
      - "**/*.cabal"
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release-hackage-atelier-core:
    uses: ./.github/workflows/release-hackage-package.yml
    needs:
      - checks
    secrets: inherit
    with:
      package-name: atelier-core

  release-hackage-atelier-prelude:
    uses: ./.github/workflows/release-hackage-package.yml
    needs:
      - checks
      - release-hackage-atelier-core
    if: ${{ !failure() && needs.checks.result == 'success' }}
    secrets: inherit
    with:
      package-name: atelier-prelude

  release-hackage-tricorder-types:
    uses: ./.github/workflows/release-hackage-package.yml
    needs:
      - checks
      - release-hackage-atelier-core
    if: ${{ !failure() && needs.checks.result == 'success' }}
    secrets: inherit
    with:
      package-name: tricorder-types

  release-hackage-tricorder:
    uses: ./.github/workflows/release-hackage-package.yml
    needs:
      - checks
      - release-hackage-atelier-core
      - release-hackage-atelier-prelude
      - release-hackage-tricorder-types
    if: ${{ !failure() && needs.checks.result == 'success' }}
    secrets: inherit
    with:
      package-name: tricorder

  release-github-tricorder:
    uses: ./.github/workflows/release-github.yml
    needs:
      - checks
      - release-hackage-tricorder
    if: ${{ needs.release-hackage-tricorder.outputs.published == 'true' }}
    secrets: inherit
    with:
      ref: ${{ needs.release-hackage-tricorder.outputs.tag }}

  release-hackage-tricorder-mcp:
    uses: ./.github/workflows/release-hackage-package.yml
    needs:
      - checks
      - release-hackage-atelier-core
      - release-hackage-atelier-prelude
      - release-hackage-tricorder-types
    if: ${{ !failure() && needs.checks.result == 'success' }}
    secrets: inherit
    with:
      package-name: tricorder-mcp

  release-github-tricorder-mcp:
    uses: ./.github/workflows/release-github.yml
    needs:
      - checks
      - release-hackage-tricorder-mcp
    if: ${{ needs.release-hackage-tricorder-mcp.outputs.published == 'true' }}
    secrets: inherit
    with:
      ref: ${{ needs.release-hackage-tricorder-mcp.outputs.tag }}
